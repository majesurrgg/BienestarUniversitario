<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" fill="url(#base)"/>

  <!-- Formas suaves tipo "blob", paleta turquesa + el rosa de acento,
       pensadas para que el logo y los campos del login queden legibles
       encima (concentradas en las esquinas, centro despejado). -->
  <circle cx="40" cy="80" r="190" fill="#1E6E6A" opacity="0.10"/>
  <circle cx="370" cy="40" r="140" fill="#5FC2BC" opacity="0.16"/>
  <circle cx="-30" cy="420" r="150" fill="#C98A9A" opacity="0.12"/>
  <circle cx="430" cy="620" r="220" fill="#1E6E6A" opacity="0.08"/>
  <circle cx="120" cy="760" r="170" fill="#E3A9B7" opacity="0.14"/>
  <circle cx="350" cy="760" r="90" fill="#1E6E6A" opacity="0.10"/>

  <!-- Trazo circular suelto, un detalle "orgánico" extra -->
  <circle cx="320" cy="260" r="60" fill="none" stroke="#1E6E6A" stroke-width="2" opacity="0.12"/>
  <circle cx="60" cy="600" r="46" fill="none" stroke="#C98A9A" stroke-width="2" opacity="0.15"/>
</svg>
